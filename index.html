<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZERV Forge — AI Content Creator</title>
  <!-- Markdown Renderer for Tables & Formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #2563eb;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 900px; margin: 0 auto; padding: 30px 20px; transition: all 0.3s ease; }
    
    /* Branding Header */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 42px; height: 42px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; }
    .brand-title { margin: 0; font-size: 1.5rem; }
    .tagline { margin: 4px 0 0 0; color: var(--muted); font-size: 0.88rem; }
    .theme-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    /* Controls */
    .control-group { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; }
    .mode-options { display: flex; gap: 20px; margin-bottom: 15px; }
    .mode-options label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    
    input[type="text"], select { width: 100%; padding: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
    button.primary-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Markdown Output Styling */
    .output-box { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 10px; margin-top: 25px; line-height: 1.7; }
    .output-box table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    .output-box th, .output-box td { border: 1px solid var(--border); padding: 10px; text-align: left; }
    .output-box th { background: var(--bg); }
    .badge { background: #16a34a; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 15px; display: inline-block; }
  </style>
</head>
<body>

  <!-- Header & Logo -->
  <div class="header">
    <div class="brand">
      <div class="logo" id="logoContainer">🚀</div>
      <div>
        <h1 class="brand-title" id="productName">EZERV Forge</h1>
        <p class="tagline" id="productTagline">From ideation to execution — autonomously, with AI agents.</p>
      </div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()">☀️ / 🌙</button>
  </div>

  <!-- Main App Controls -->
  <div class="control-group">
    <label>Choose Generation Mode:</label>
    <div class="mode-options">
      <label><input type="radio" name="mode" value="automatic" checked onchange="handleModeChange()"> 🚀 Automatic</label>
      <label><input type="radio" name="mode" value="manual" onchange="handleModeChange()"> ✍️ Manual</label>
    </div>

    <div id="topicContainer" style="display: none;">
      <label for="topic">Enter Content Topic / Keyword:</label>
      <input type="text" id="topic" placeholder="e.g., Quantum Computing, Agentic AI, Data Engineering..." />
    </div>

    <label for="tone">Select Content Tone:</label>
    <select id="tone">
      <option value="Professional & Engaging">Professional & Engaging (LinkedIn Style)</option>
      <option value="Casual & Conversational">Casual & Conversational</option>
      <option value="Technical & Deep-Dive">Technical & Deep-Dive</option>
    </select>

    <button id="generateBtn" class="primary-btn" onclick="generateContent()">Generate Content with EZERV Forge 🚀</button>
  </div>

  <div id="status"></div>
  <div id="output" class="output-box" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
